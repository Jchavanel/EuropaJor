<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/brand/favicon/favicon.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar cita — Europa Jor Automotive Service</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:      #0A0A0A;
      --ink-soft: #1C1C1E;
      --ink-mid:  #2C2C2E;
      --amber:    #E8861A;
      --amber-lt: #F5A843;
      --cream:    #F7F3EC;
      --steel:    #6B6B6B;
      --steel-lt: #A0A0A0;
      --white:    #FFFFFF;
      --red:      #DC2626;
      --green:    #16A34A;
      --r:        12px;
      --r-lg:     20px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--ink);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--ink-soft);
      border-radius: var(--r-lg);
      padding: 44px 40px;
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    /* Icono de estado */
    .state-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin: 0 auto 24px;
    }
    .icon-loading  { background: rgba(232,134,26,0.15); animation: pulse 1.4s ease-in-out infinite; }
    .icon-confirm  { background: rgba(220,38,38,0.12); border: 1.5px solid rgba(220,38,38,0.3); }
    .icon-success  { background: rgba(22,163,74,0.15); }
    .icon-error    { background: rgba(220,38,38,0.12); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }
    .card-desc {
      color: var(--steel-lt);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 28px;
    }
    .card-desc strong { color: var(--white); }

    /* Detalle de la cita */
    .booking-detail {
      background: var(--ink-mid);
      border: 1px solid rgba(232,134,26,0.2);
      border-radius: var(--r);
      padding: 20px;
      margin-bottom: 28px;
      text-align: left;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.9rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label {
      color: var(--steel-lt);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }
    .detail-value {
      color: var(--white);
      font-weight: 700;
      text-align: right;
    }
    .detail-value.highlight {
      color: var(--amber);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.2rem;
    }

    /* Botones */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      border-radius: 999px;
      border: none;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s ease;
      margin-bottom: 10px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:hover { opacity: 0.85; }
    .btn-red    { background: var(--red);   color: var(--white); }
    .btn-ghost  { background: var(--ink-mid); color: var(--steel-lt);
                  border: 1.5px solid rgba(255,255,255,0.1); }
    .btn-amber  { background: linear-gradient(145deg, var(--amber-lt), var(--amber)); color: var(--ink); }
    .btn-ghost-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--steel);
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-ghost-home:hover { color: var(--amber); }

    /* Logo pequeño arriba */
    .logo-top {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--amber);
      letter-spacing: 0.08em;
      margin-bottom: 32px;
      opacity: 0.7;
    }
  </style>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/firebase-db.js"></script>
</head>
<body>

  <div class="logo-top">EUROPA JOR · AUTOMOTIVE SERVICE</div>

  <div class="card" id="card">
    <!-- El contenido se inyecta por JS según el estado -->
    <div class="state-icon icon-loading">⏳</div>
    <div class="card-title">Buscando tu cita…</div>
    <div class="card-desc">Un momento.</div>
  </div>

  <a href="index.html" class="btn-ghost-home">← Volver a la web</a>

<script>
(function () {
  'use strict';

  var WA_NUMBER   = '34638317126';
  var DAYS_ES     = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var MONTHS_ES   = ['enero','febrero','marzo','abril','mayo','junio',
                     'julio','agosto','septiembre','octubre','noviembre','diciembre'];

  // ── Helpers ──────────────────────────────────────────────
  function formatDate(ds) {
    var p  = ds.split('-');
    var dw = new Date(ds + 'T00:00:00').getDay();
    return DAYS_ES[dw] + ' ' + parseInt(p[2]) + ' de ' +
           MONTHS_ES[parseInt(p[1]) - 1] + ' de ' + p[0];
  }
  function formatDateShort(ds) {
    var p = ds.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  // ── Buscar reserva por token (Firebase async) ──────────────
  async function findByToken(token) {
    var db = await EJDb.loadAll() || {};
    for (var ds in db) {
      for (var slot in db[ds]) {
        if (db[ds][slot] && db[ds][slot].token === token) {
          return { dateStr: ds, slot: slot, data: db[ds][slot] };
        }
      }
    }
    return null;
  }

  async function deleteBooking(ds, slot) {
    return await EJDb.remove(ds, slot);
  }

  // ── Renderizar estados ────────────────────────────────────
  var card = document.getElementById('card');

  function renderNotFound() {
    card.innerHTML =
      '<div class="state-icon icon-error">🔍</div>' +
      '<div class="card-title">Cita no encontrada</div>' +
      '<div class="card-desc">' +
        'Este enlace no corresponde a ninguna cita activa.<br>' +
        'Es posible que ya haya sido cancelada o que el enlace sea incorrecto.' +
      '</div>' +
      '<a href="index.html#cita" class="btn btn-amber">Hacer una nueva reserva</a>';
  }

  function renderPast(booking) {
    var fd = formatDate(booking.dateStr);
    card.innerHTML =
      '<div class="state-icon icon-error">📅</div>' +
      '<div class="card-title">Cita ya pasada</div>' +
      '<div class="card-desc">' +
        'La cita del <strong>' + fd + '</strong> a las <strong>' + booking.slot + ' h</strong> ' +
        'ya ha pasado y no se puede cancelar.' +
      '</div>' +
      '<a href="index.html#cita" class="btn btn-amber">Reservar nueva cita</a>';
  }

  function renderConfirm(booking) {
    var fd = formatDate(booking.dateStr);
    var detail =
      '<div class="booking-detail">' +
        row('Nombre',   booking.data.nombre   || '—') +
        row('Fecha',    fd, true) +
        row('Hora',     booking.slot + ' h', true) +
        (booking.data.vehiculo ? row('Vehículo', booking.data.vehiculo) : '') +
        (booking.data.servicio && booking.data.servicio !== 'Selecciona un servicio…'
          ? row('Servicio', booking.data.servicio) : '') +
      '</div>';

    card.innerHTML =
      '<div class="state-icon icon-confirm">❌</div>' +
      '<div class="card-title">¿Cancelar esta cita?</div>' +
      '<div class="card-desc">Estos son los datos de tu reserva:</div>' +
      detail +
      '<button class="btn btn-red" id="btn-confirm-cancel">Sí, cancelar mi cita</button>' +
      '<button class="btn btn-ghost" id="btn-keep">No, conservar la cita</button>';

    document.getElementById('btn-confirm-cancel').addEventListener('click', async function() {
      await executeCancellation(booking);
    });
    document.getElementById('btn-keep').addEventListener('click', function() {
      window.location.href = 'index.html';
    });
  }

  function row(label, value, highlight) {
    return '<div class="detail-row">' +
      '<span class="detail-label">' + label + '</span>' +
      '<span class="detail-value' + (highlight ? ' highlight' : '') + '">' + value + '</span>' +
      '</div>';
  }

  async function executeCancellation(booking) {
    var ok = await deleteBooking(booking.dateStr, booking.slot);
    if (ok) {
      renderSuccess(booking);
    } else {
      renderError();
    }
  }

  function renderSuccess(booking) {
    var fd  = formatDateShort(booking.dateStr);
    // Mensaje WhatsApp al taller avisando de la cancelación
    var msg = encodeURIComponent(
      '❌ Cancelación de cita — Europa Jor\n' +
      'Nombre: ' + (booking.data.nombre || '—') + '\n' +
      'Fecha y hora cancelada: ' + fd + ' a las ' + booking.slot + ' h\n' +
      (booking.data.vehiculo ? 'Vehículo: ' + booking.data.vehiculo + '\n' : '') +
      '\nEl hueco ha quedado libre.'
    );
    var waUrl = 'https://wa.me/' + WA_NUMBER + '?text=' + msg;

    card.innerHTML =
      '<div class="state-icon icon-success">✓</div>' +
      '<div class="card-title">Cita cancelada</div>' +
      '<div class="card-desc">' +
        'Tu cita del <strong>' + formatDate(booking.dateStr) + '</strong> ' +
        'a las <strong>' + booking.slot + ' h</strong> ha sido cancelada.<br><br>' +
        'El hueco ya está libre para otros clientes.' +
      '</div>' +
      '<a href="' + waUrl + '" target="_blank" rel="noopener noreferrer" class="btn btn-amber">' +
        '💬 Avisar al taller por WhatsApp' +
      '</a>' +
      '<a href="index.html#cita" class="btn btn-ghost">Hacer una nueva reserva</a>';
  }

  function renderError() {
    card.innerHTML =
      '<div class="state-icon icon-error">⚠️</div>' +
      '<div class="card-title">Error al cancelar</div>' +
      '<div class="card-desc">' +
        'No se pudo cancelar la cita automáticamente.<br>' +
        'Por favor, contacta directamente con el taller.' +
      '</div>' +
      '<a href="tel:+34638317126" class="btn btn-amber">📞 Llamar al taller</a>' +
      '<a href="https://wa.me/' + WA_NUMBER + '" target="_blank" rel="noopener noreferrer" class="btn btn-ghost">' +
        '💬 WhatsApp' +
      '</a>';
  }

  // ── Leer token de la URL y actuar ─────────────────────────
  async function init() {
    var params = new URLSearchParams(window.location.search);
    var token  = params.get('t');

    if (!token) { renderNotFound(); return; }

    var booking = await findByToken(token);
    if (!booking) { renderNotFound(); return; }

    // Comprobar si la cita ya pasó
    var todayStr = (function() {
      var d = new Date();
      var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
      return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    })();

    if (booking.dateStr < todayStr) { renderPast(booking); return; }

    renderConfirm(booking);
  }

  // URLSearchParams: compatible Chrome 49+, Firefox 44+, Safari 10.1+, Edge 17+
  // Para IE11 (si fuera necesario) usar un polyfill mínimo
  if (typeof URLSearchParams === 'undefined') {
    // Fallback básico
    window.URLSearchParams = function(search) {
      this.get = function(key) {
        var re = new RegExp('[?&]' + key + '=([^&]*)');
        var m  = (search || '').match(re);
        return m ? decodeURIComponent(m[1]) : null;
      };
    };
  }

  init();
})();
</script>
</body>
</html>
